---
name: CI image

on:
  workflow_call:
    outputs:
      image:
        description: Container image for the CI jobs, the central default or the repository's `CI_IMAGE`.
        value: ${{ jobs.ci-image.outputs.image }}

env:
  # Central CI image for every repository that uses this workflow.
  # A repository can opt out by setting the `CI_IMAGE` variable.
  DEFAULT_CI_IMAGE: ghcr.io/boehringer-ingelheim/r_4.6.0_cran_2026.05.31:latest

jobs:
  ci-image:
    name: ${{ vars.CI_IMAGE != '' && '⚠️ Bypassed' || 'Central default' }}
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.resolve.outputs.image }}

    steps:
      - name: Resolve CI image
        id: resolve
        shell: bash
        env:
          BYPASS: ${{ vars.CI_IMAGE }}
        run: |
          if [ -n "$BYPASS" ]; then
            IMAGE="$BYPASS"
            SOURCE="\`CI_IMAGE\` repository variable"
            echo "::warning title=CI image bypassed::CI_IMAGE is set: running on '$BYPASS' instead of the central default '$DEFAULT_CI_IMAGE' from dv.templates."
            if [ "$BYPASS" = "$DEFAULT_CI_IMAGE" ]; then
              echo "::warning title=Redundant bypass::CI_IMAGE is the same as the central default. Delete the variable."
            fi
          else
            IMAGE="$DEFAULT_CI_IMAGE"
            SOURCE="central default (dv.templates)"
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          {
            echo "### CI image 🐳"
            echo ""
            echo "| Image | Source |"
            echo "|---|---|"
            echo "| \`$IMAGE\` | $SOURCE |"
            if [ -n "$BYPASS" ]; then
              echo ""
              echo "⚠️ **This repository bypasses the central CI image.** Delete the \`CI_IMAGE\` variable to go back to \`$DEFAULT_CI_IMAGE\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add CI image comment
        if: github.event_name == 'pull_request' && vars.CI_IMAGE != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BYPASS: ${{ vars.CI_IMAGE }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **CI image bypassed.** This repository sets the \`CI_IMAGE\` variable, so CI runs on \`$BYPASS\` instead of the default \`$DEFAULT_CI_IMAGE\` from dv.templates. Delete the variable in the repository settings to use the default." \
            || echo "::notice title=No PR comment::Could not comment on the PR. \`CI_IMAGE\` is used instead of the default."
